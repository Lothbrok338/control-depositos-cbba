                    )
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =Parent.Width - 840
                  X: =800
                  Y: =302
            - lblResFilasTituloP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
