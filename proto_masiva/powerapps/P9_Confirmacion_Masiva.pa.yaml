                Properties:
                  Color: =RGBA(52, 55, 58, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =10
                  Text: =If(Coalesce(varResultadoP9.tabla_encontrada, "") = "SI", varResultadoP9.filas_leidas, "—")
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =Parent.Width - 840
                  X: =800
                  Y: =332
            - lblResMensajeTituloP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =9
                  Text: ="Mensaje"
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =150
                  X: =640
                  Y: =362
            - lblResMensajeP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(52, 55, 58, 1)
                  Font: =Font.'Segoe UI'
                  Height: =70
                  Size: =10
                  Text: =Coalesce(varResultadoConfirmacionP9.mensaje, varResultadoP9.mensaje, "—")
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =Parent.Width - 840
                  X: =800
                  Y: =362
            - lblResTiempoTituloP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =9
                  Text: ="TIEMPO DE PROCESAMIENTO"
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =300
                  X: =640
                  Y: =442
            - lblResTiempoP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =10
                  Text: =If(IsBlank(Coalesce(varMsConfirmacionP9, varMsAppP9)), "—", Text(Coalesce(varMsConfirmacionP9, varMsAppP9) / 1000, "0.0") & " segundos")
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =300
                  X: =640
                  Y: =466
            - lblResCopiaTituloP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =9
                  Text: ="Copia temporal"
                  Visible: =false
                  Width: =150
                  X: =640
                  Y: =490
            - lblResCopiaP9:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(98, 102, 106, 1)
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Size: =9
                  Text: |-
                    =Switch(
                        Coalesce(varResultadoP9.copia_temporal_eliminada, ""),
                        "SI", "Eliminada",
                        "NO", "NO se pudo eliminar (avise al administrador)",
                        "NO_APLICA", "No se creó",
                        "—"
                    )
                  Visible: =false
                  Width: =Parent.Width - 840
                  X: =800
                  Y: =490
            - btnConfirmarMasivamenteP9:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: |-
                    =If(
                        !Coalesce(varProcesandoP9, false) &&
                        !Coalesce(varProcesandoConfirmacionP9, false) &&
                        !Coalesce(varConfirmacionMasivaFinalizadaP9, false) &&
                        CountRows(Filter(colPrevalidacionP9, resultado = "VALIDO")) > 0,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Fill: =RGBA(46, 125, 50, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =46
                  OnSelect: |-
                    =Set(varProcesandoConfirmacionP9, true);
                    Set(varResultadoConfirmacionP9, Blank());
                    Set(varMsConfirmacionP9, Blank());
                    Set(varVerObservacionesP9, false);
                    Clear(colConfirmacionP9);
                    With(
                        {inicioConfirmacionP9: Now()},
                        IfError(
                            Set(
                                varResultadoConfirmacionP9,
                                P9_MASIVA_PROTO_CONFIRMAR.Run(
                                    JSON(
                                        ShowColumns(Filter(colPrevalidacionP9, resultado = "VALIDO"), "fila_excel", "deposito_id", "clave_transaccion", "banco", "cuenta_bancaria", "codigo_asignacion", "importe", "moneda", "estudiante", "solicitado_por", "sede", "observacion"),
                                        JSONFormat.Compact
                                    ),
                                    User().Email
                                )
                            );
                            Set(varMsConfirmacionP9, DateDiff(inicioConfirmacionP9, Now(), TimeUnit.Milliseconds));
                            IfError(
                                ClearCollect(
                                    colConfirmacionP9,
                                    ForAll(
                                        Table(ParseJSON(varResultadoConfirmacionP9.detalle_json)),
                                        {
                                            fila_excel: Value(ThisRecord.Value.fila_excel),
                                            deposito_id: Value(ThisRecord.Value.deposito_id),
                                            resultado: Text(ThisRecord.Value.resultado),
                                            mensaje: Text(ThisRecord.Value.mensaje),
                                            estado_final: Text(ThisRecord.Value.estado_final),
                                            banco: Text(ThisRecord.Value.banco),
                                            cuenta_bancaria: Text(ThisRecord.Value.cuenta_bancaria),
                                            codigo_asignacion: Text(ThisRecord.Value.codigo_asignacion),
                                            importe: Value(ThisRecord.Value.importe),
                                            moneda: Text(ThisRecord.Value.moneda)
                                        }
                                    )
                                ),
                                Notify("No se pudo leer el detalle de la confirmación: " & FirstError.Message, NotificationType.Warning)
                            ),
                            Set(
                                varResultadoConfirmacionP9,
                                {
                                    resultado: "ERROR",
                                    codigo: "FLUJO_SIN_RESPUESTA",
                                    mensaje: "El flujo no respondió: " & FirstError.Message & ". Es posible que haya seguido confirmando depósitos: vuelva a PREVALIDAR para ver el estado real antes de reintentar.",
                                    filas_recibidas: "0",
                                    filas_confirmadas: "0",
                                    filas_no_confirmadas: "0",
                                    detalle_json: "[]",
                                    tiempos_ms: ""
                                }
                            );
                            Set(varMsConfirmacionP9, DateDiff(inicioConfirmacionP9, Now(), TimeUnit.Milliseconds))
                        )
                    );
                    Set(varConfirmacionMasivaFinalizadaP9, true);
                    Set(varProcesandoConfirmacionP9, false)
                  Size: =11
                  Text: ="CONFIRMAR MASIVAMENTE (" & CountRows(Filter(colPrevalidacionP9, resultado = "VALIDO")) & ")"
                  Width: =330
                  X: =20
                  Y: =506
            - btnVerObservacionesP9:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(123, 22, 50, 1)
                  BorderThickness: =1
                  Color: =RGBA(123, 22, 50, 1)
                  DisplayMode: =If(If(!IsBlank(varResultadoConfirmacionP9), CountRows(Filter(colConfirmacionP9, resultado <> "CONFIRMADO")), CountRows(Filter(colPrevalidacionP9, resultado <> "VALIDO"))) > 0 && !Coalesce(varProcesandoP9, false) && !Coalesce(varProcesandoConfirmacionP9, false), DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  OnSelect: =Set(varVerObservacionesP9, !Coalesce(varVerObservacionesP9, false))
                  Size: =9
                  Text: =If(Coalesce(varVerObservacionesP9, false), "OCULTAR OBSERVACIONES", "VER OBSERVACIONES (" & If(!IsBlank(varResultadoConfirmacionP9), CountRows(Filter(colConfirmacionP9, resultado <> "CONFIRMADO")), CountRows(Filter(colPrevalidacionP9, resultado <> "VALIDO"))) & ")")
                  Width: =260
