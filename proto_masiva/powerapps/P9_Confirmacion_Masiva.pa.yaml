                  Color: =RGBA(52, 55, 58, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =10
                  Text: =Coalesce(varResultadoP9.archivo, "—")
                  Visible: =!Coalesce(varVerObservacionesP9, false)
                  Width: =Parent.Width - 840
                  X: =800
                  Y: =272
            - lblResTablaTituloP9:
