            X: =20
            Y: =392
      - lblPaso3MasivaP9:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(94, 16, 38, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =24
            Size: =11
            Text: ="3 · PREVALIDAR"
            Width: =400
            X: =20
            Y: =425
      - btnPrevalidarP9:
          Control: Classic/Button@2.2.0
          Properties:
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If(
                  Coalesce(varProcesandoP9, false) ||
                  IsEmpty(attXlsxP9.Attachments) ||
                  !EndsWith(Lower(First(attXlsxP9.Attachments).Name), ".xlsx"),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(123, 22, 50, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =42
            OnSelect: |-
              =Set(varProcesandoP9, true);
              Set(varResultadoP9, Blank());
              Set(varMsAppP9, Blank());
              With(
                  {inicioP9: Now(), archivoP9: First(attXlsxP9.Attachments)},
                  IfError(
                      Set(varResultadoP9, P9_MASIVA_PROTO_PREVALIDAR.Run({name: archivoP9.Name, contentBytes: archivoP9.Value}));
                      Set(varMsAppP9, DateDiff(inicioP9, Now(), TimeUnit.Milliseconds)),
                      Set(
                          varResultadoP9,
                          {
                              resultado: "ERROR",
                              codigo: "FLUJO_SIN_RESPUESTA",
                              mensaje: "El flujo no respondió: " & FirstError.Message,
                              archivo: archivoP9.Name,
                              tabla_encontrada: "",
                              filas_leidas: "0",
                              copia_temporal_eliminada: "",
                              tiempos_ms: ""
                          }
                      );
                      Set(varMsAppP9, DateDiff(inicioP9, Now(), TimeUnit.Milliseconds))
                  )
              );
              Set(varProcesandoP9, false)
            Size: =10
            Text: ="PREVALIDAR ARCHIVO"
            Width: =220
            X: =20
            Y: =452
      - rectPanelResultadoP9:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(217, 218, 221, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =440
            Width: =Parent.Width - 640
            X: =620
            Y: =95
      - lblEstadoTituloP9:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(52, 55, 58, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =9
            Text: ="ESTADO"
            Width: =200
            X: =640
            Y: =108
      - lblEstadoP9:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Fill: |-
              =With(
                  {estadoP9: If(Coalesce(varProcesandoP9, false), "PROCESANDO", If(!IsBlank(varResultadoP9), varResultadoP9.resultado, If(IsEmpty(attXlsxP9.Attachments), "SIN ARCHIVO", "CARGADO")))},
                  Switch(
                      estadoP9,
                      "COMPLETADO", RGBA(46, 125, 50, 1),
                      "ERROR", RGBA(183, 28, 28, 1),
                      "PROCESANDO", RGBA(230, 126, 34, 1),
                      "CARGADO", RGBA(0, 120, 212, 1),
                      RGBA(98, 102, 106, 1)
                  )
              )
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =34
            Size: =11
            Text: =If(Coalesce(varProcesandoP9, false), "PROCESANDO", If(!IsBlank(varResultadoP9), varResultadoP9.resultado, If(IsEmpty(attXlsxP9.Attachments), "SIN ARCHIVO", "CARGADO")))
            Width: =200
            X: =640
            Y: =132
      - lblTitularResultadoP9:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(94, 16, 38, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =12
            Text: |-
              =If(
                  Coalesce(varProcesandoP9, false),
                  "Procesando el archivo (puede tardar unos segundos)...",
                  If(
                      IsBlank(varResultadoP9),
                      If(IsEmpty(attXlsxP9.Attachments), "Adjunte un Excel (.xlsx) para empezar.", "Archivo seleccionado. Pulse PREVALIDAR ARCHIVO."),
                      If(
                          varResultadoP9.resultado = "COMPLETADO",
                          "ARCHIVO RECIBIDO · TABLA ENCONTRADA · " & varResultadoP9.filas_leidas & If(Value(varResultadoP9.filas_leidas) = 1, " FILA LEÍDA", " FILAS LEÍDAS"),
                          "RESULTADO: " & varResultadoP9.codigo
                      )
                  )
              )
            Width: =Parent.Width - 680
            X: =640
            Y: =182
