[pytest]
testpaths = .
addopts = -p no:cacheprovider -W ignore::FutureWarning -W ignore::DeprecationWarning -W ignore::UserWarning
markers =
    preservacion: P2, la captura de ORIGEN no pierde ni altera informacion del banco
    regresion: protege comportamiento actual valido (debe pasar antes y despues de cualquier cambio)
    defecto: defecto real diagnosticado; hoy falla (xfail estricto) y debe pasar tras la correccion
    registro: P3-P6 registro_bancos.json + motor_generico.py (unica normalizacion desde P6; el comparador con el legado se retiro en P6)
    historico: P3b, capa 4 EXTRACTO_HISTORICO (Contabilidad / Ingresos) construida solo desde ORIGEN + NORMALIZADO + registro
    deteccion: P4, la deteccion productiva (banco, cuenta, moneda, formato) sale de registro_bancos.json
    normalizacion: P5, la normalizacion y la validacion de saldos productivas salen del motor generico gobernado por registro_bancos.json
    retiro: P6, retiro controlado del legado de normalizacion (produccion sin normalizar_* ni sombra)
    m365: P7, adaptador Microsoft 365 (LISTS.csv -> artefacto JSON para Power Automate); capa nueva, no toca el motor ni las doradas P6
