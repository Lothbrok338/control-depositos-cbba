                  - btnSolicitarReversionP9:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: |-
                          =If(
                              Coalesce(varP9RevCargando, false) ||
                              With(
                                  {e: If(!IsBlank(varP9RevVerif.DepositoID) && varP9RevVerif.DepositoID = varDepositoSeleccionado.ID, varP9RevVerif.Estado, "SIN_VERIFICAR")},
                                  e = "VERIFICANDO" || e = "ACTIVA" || e = "ERROR"
                              ),
