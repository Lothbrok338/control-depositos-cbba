            - galDepositosP9_1:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(217, 218, 221, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height - 235
                  Items: |-
                    =If(
                        IsBlank(Trim(txtTextoP9_1.Text)),
                        SortByColumns(
                            Filter(
                                [@Depositos_Activos],
                                (ESTADO_ASIGNACION.Value = "DISPONIBLE" || ESTADO_ASIGNACION.Value = "ASIGNADO"),
                                TIPO_MOVIMIENTO = "CRÉDITO",
                                FECHA_MOVIMIENTO >= DateAdd(Today(), -2, TimeUnit.Months),
                                FECHA_MOVIMIENTO <= Today(),
                                IsBlank(dpFechaDesdeP9_1.SelectedDate) || FECHA_MOVIMIENTO >= dpFechaDesdeP9_1.SelectedDate,
                                IsBlank(dpFechaHastaP9_1.SelectedDate) || FECHA_MOVIMIENTO <= dpFechaHastaP9_1.SelectedDate,
                                IsBlank(txtImporteP9_1.Text) || IMPORTE = Value(txtImporteP9_1.Text),
                                IsBlank(cmbBancoP9_1.Selected.Value) || cmbBancoP9_1.Selected.Value = "(Todos)" || BANCO = cmbBancoP9_1.Selected.Value,
                                IsBlank(cmbCuentaP9_1.Selected.Cuenta) || CUENTA_BANCARIA = cmbCuentaP9_1.Selected.Cuenta,
                                IsBlank(txtCodigoP9_1.Text) || StartsWith(CODIGO_ASIGNACION, txtCodigoP9_1.Text)
                            ),
                            "FECHA_MOVIMIENTO",
                            SortOrder.Descending
                        ),
                        With(
                            {
                                baseP9: Filter(
                                    [@Depositos_Activos],
                                    (ESTADO_ASIGNACION.Value = "DISPONIBLE" || ESTADO_ASIGNACION.Value = "ASIGNADO"),
                                    TIPO_MOVIMIENTO = "CRÉDITO",
                                    FECHA_MOVIMIENTO >= DateAdd(Today(), -2, TimeUnit.Months),
                                    FECHA_MOVIMIENTO <= Today(),
                                    IsBlank(dpFechaDesdeP9_1.SelectedDate) || FECHA_MOVIMIENTO >= dpFechaDesdeP9_1.SelectedDate,
                                    IsBlank(dpFechaHastaP9_1.SelectedDate) || FECHA_MOVIMIENTO <= dpFechaHastaP9_1.SelectedDate,
                                    IsBlank(txtImporteP9_1.Text) || IMPORTE = Value(txtImporteP9_1.Text),
                                    IsBlank(cmbBancoP9_1.Selected.Value) || cmbBancoP9_1.Selected.Value = "(Todos)" || BANCO = cmbBancoP9_1.Selected.Value,
                                    IsBlank(cmbCuentaP9_1.Selected.Cuenta) || CUENTA_BANCARIA = cmbCuentaP9_1.Selected.Cuenta,
                                    IsBlank(txtCodigoP9_1.Text) || StartsWith(CODIGO_ASIGNACION, txtCodigoP9_1.Text)
                                )
                            },
                            SortByColumns(
                                Filter(
                                    baseP9,
                                    Lower(Trim(txtTextoP9_1.Text)) in Lower(Coalesce(DESCRIPCION, ""))
                                ),
                                "FECHA_MOVIMIENTO",
                                SortOrder.Descending
                            )
                        )
                    )
