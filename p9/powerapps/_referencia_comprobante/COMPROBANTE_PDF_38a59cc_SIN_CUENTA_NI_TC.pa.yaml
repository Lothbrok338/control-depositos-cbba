            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =lblFirmaPDF.Y + lblFirmaPDF.Height + 16
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Width: =Parent.Width - 80
            X: =40
            Y: =70
            Visible: =!IsBlank(varP9ComprobanteID) && !IsBlank(varP9Comprobante.ID) && varP9Comprobante.ID = varP9ComprobanteID && varP9Comprobante.ESTADO_ASIGNACION.Value = "ASIGNADO"
